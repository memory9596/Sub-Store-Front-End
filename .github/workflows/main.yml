name: build
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "package.json"
  pull_request:
    branches:
      - master
    paths:
      - "package.json"
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: "master"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
      - name: Install dependencies
        run: |
          corepack enable
          pnpm config set registry https://registry.npmmirror.com
          pnpm install --no-frozen-lockfile
      - name: build
        run: |
          pnpm build
      - name: zip
        run: |
          zip -r dist.zip dist
      - id: tag
        name: Generate release tag
        run: |
          SUB_STORE_RELEASE="$(node --eval='process.stdout.write(require("./package.json").version)')"
          echo "release_tag=$SUB_STORE_RELEASE" >> "$GITHUB_OUTPUT"
      - name: Delete old releases and tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          tags=$(gh release list --repo "$REPO" --limit 1 | cut -f 1)
          for tag in $tags; do
            echo "Deleting release and tag: $tag"
            gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag
          done
      - name: Prepare release
        run: |
          pnpm i -D conventional-changelog-cli
          pnpm run changelog
      - name: Release
        uses: softprops/action-gh-release@v3
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body_path: ./CHANGELOG.md
          tag_name: ${{ steps.tag.outputs.release_tag }}
          # generate_release_notes: true
          files: |
            dist.zip
      - name: Custom clean up workflow runs
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              per_page: 100
            })
            const now = new Date()
            console.log(now.toLocaleString('sv-SE'))
            const todayStr = now.toLocaleDateString('sv-SE')
            const yesterday = new Date(now)
            yesterday.setDate(yesterday.getDate() - 1)
            const yesterdayStr = yesterday.toLocaleDateString('sv-SE')
            const allowedDays = [todayStr, yesterdayStr]
            const keptRuns = new Set()
            for (const run of runs) {
              const dateString = new Date(run.created_at).toLocaleDateString('sv-SE')
              const cacheKey = `${run.workflow_id}-${dateString}`
              if (!allowedDays.includes(dateString)) {
                console.log(`[Delete] Run ${run.id} (${run.name}, ${dateString}) - Older than 2 days`)
                try {
                  await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id })
                } catch (e) {
                  console.log(`Skipped or failed: ${e.message}`)
                }
                continue
              }
              if (keptRuns.has(cacheKey)) {
                console.log(`[Delete] Run ${run.id} (${run.name}, ${dateString}) - Not the latest for this date`)
                try {
                  await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id })
                } catch (e) {
                  console.log(`Skipped or failed (possibly running): ${e.message}`)
                }
              } else {
                console.log(`[Retain] Run ${run.id} (${run.name}, ${dateString}) - Latest for this date`)
                keptRuns.add(cacheKey)
              }
            }
    env:
      TZ: Asia/Shanghai